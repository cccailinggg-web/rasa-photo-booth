<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta
    name="description"
    content="RASA PHOTO BOOTH：選擇濾鏡、拍照並下載，照片不會上傳或保存。"
  >
  <title>RASA PHOTO BOOTH</title>

  <link rel="stylesheet" href="./styles.css">

  <style>
    /*
      這一版直接在 index.html 內覆寫視覺，
      不需要修改 app.js，也可先不動 styles.css。
    */

    .intro-screen {
      position: relative;
      justify-content: space-between;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.04), transparent 26%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03), transparent 28%),
        #050505;
    }

    .intro-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.025),
          transparent 20%,
          transparent 80%,
          rgba(255, 255, 255, 0.015)
        ),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 5px
        );
      opacity: 0.65;
    }

    .intro-topbar,
    .intro-bottombar {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      align-items: center;
    }

    .intro-topbar {
      justify-content: flex-start;
      min-height: 54px;
    }

    .intro-bottombar {
      justify-content: flex-end;
      min-height: 54px;
      margin-top: 14px;
    }

    /* Logo：無底色、無黃塊、直接呈現 */

    .intro-logo-mark {
      width: min(118px, 32vw);
      height: auto;
      opacity: 0.92;
      filter:
        drop-shadow(0 2px 10px rgba(255,255,255,0.05))
        drop-shadow(0 10px 24px rgba(0,0,0,0.35));
    }

    .corner-logo-wenyi {
      width: min(138px, 42vw);
      opacity: 0.76;
      filter:
        drop-shadow(0 2px 10px rgba(255,255,255,0.04))
        drop-shadow(0 8px 22px rgba(0,0,0,0.28));
    }

    .intro-machine-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 0;
    }

    .intro-machine {
      width: 100%;
      max-width: 430px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 34px;
      background:
        linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
      box-shadow:
        0 26px 60px rgba(0, 0, 0, 0.58),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(255, 255, 255, 0.02);
    }

    .machine-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 6px 14px;
    }

    .machine-brand {
      color: rgba(255,255,255,0.9);
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      white-space: nowrap;
    }

    .machine-lights {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .machine-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2c2c2c;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    .machine-light.is-on {
      background: #f4f4f4;
      box-shadow: 0 0 10px rgba(255,255,255,0.45);
    }

    .machine-window {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 26px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.01)
        ),
        #0a0a0a;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.025),
        inset 0 20px 40px rgba(255, 255, 255, 0.015);
    }

    .machine-window::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        130deg,
        rgba(255, 255, 255, 0.07),
        transparent 34%
      );
      opacity: 0.55;
    }

    .window-screen {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 420px;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 22px 24px;
    }

    .window-tag {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      padding: 0 12px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      color: #f1f1f1;
      background: rgba(255,255,255,0.05);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      backdrop-filter: blur(4px);
    }

    .window-screen .eyebrow {
      margin-bottom: 8px;
      color: #909090;
      letter-spacing: 0.18em;
    }

    .window-screen h1 {
      margin: 0;
      color: #fafafa;
      font-size: clamp(2.1rem, 8vw, 3.4rem);
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    .window-copy {
      max-width: 18em;
      margin: 18px 0 0;
      color: #b8b8b8;
      font-size: 0.98rem;
      line-height: 1.8;
    }

    .window-bottom {
      position: relative;
      z-index: 1;
      padding: 0 18px 18px;
    }

    .start-button {
      min-height: 56px;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
    }

    .intro-screen .privacy-note {
      margin-top: 14px;
      color: #8a8a8a;
      font-size: 0.74rem;
    }

    /* 按鈕黑白化 */

    .primary-button {
      color: #050505 !important;
      background: #f2f2f2 !important;
      box-shadow: 0 10px 26px rgba(255,255,255,0.08) !important;
    }

    .secondary-button {
      color: #f5f5f5 !important;
      border: 1px solid rgba(255,255,255,0.22) !important;
      background: rgba(255,255,255,0.04) !important;
    }

    .text-button {
      color: #cfcfcf !important;
    }

    /* 拍照頁與完成頁：Logo 可點回首頁，無底塊 */

    .page-heading {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .home-logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      width: 82px;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      text-decoration: none;
      transition:
        transform 140ms ease,
        opacity 140ms ease;
    }

    .home-logo-link img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0.92;
      filter:
        drop-shadow(0 2px 8px rgba(255,255,255,0.04))
        drop-shadow(0 8px 20px rgba(0,0,0,0.35));
    }

    .home-logo-link:active {
      transform: scale(0.96);
      opacity: 0.82;
    }

    .home-logo-link:focus-visible {
      outline: 2px solid rgba(255,255,255,0.8);
      outline-offset: 4px;
      border-radius: 6px;
    }

    .camera-screen .topbar,
    .result-screen .topbar {
      align-items: flex-start;
    }

    .camera-screen .topbar h1,
    .result-screen .topbar h1 {
      letter-spacing: -0.03em;
    }

    .frame-option span:last-child {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* 將原本暖色卡片微調為黑白銀灰感 */

    .camera-card,
    .result-card {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06)) !important;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.42) !important;
    }

    .frame-option.is-selected {
      color: #f5f5f5 !important;
      border-color: rgba(255,255,255,0.42) !important;
      background: rgba(255,255,255,0.08) !important;
    }

    .icon-button {
      border: 1px solid rgba(255,255,255,0.2) !important;
      background: rgba(255,255,255,0.04) !important;
    }

    .shutter-button {
      border-color: #f2f2f2 !important;
    }

    .shutter-inner {
      background: #f2f2f2 !important;
    }

    @media (min-width: 640px) {
      .window-screen {
        min-height: 460px;
        padding: 34px 28px 26px;
      }

      .window-bottom {
        padding: 0 22px 22px;
      }

      .intro-machine {
        max-width: 460px;
      }

      .home-logo-link {
        width: 90px;
      }

      .intro-logo-mark {
        width: 124px;
      }
    }
  </style>
</head>

<body>
  <main class="app-shell">
    <!-- 首頁 -->
    <section
      class="screen intro-screen is-active"
      id="introScreen"
      aria-labelledby="introTitle"
    >
      <div class="intro-topbar">
        <img
          class="intro-logo-mark"
          src="./assets/rasa-logo.png"
          alt="RASA"
        >
      </div>

      <div class="intro-machine-wrap">
        <div class="intro-machine">
          <div class="machine-head">
            <div class="machine-brand">RASA PRESENT</div>

            <div class="machine-lights" aria-hidden="true">
              <span class="machine-light is-on"></span>
              <span class="machine-light"></span>
              <span class="machine-light"></span>
            </div>
          </div>

          <div class="machine-window">
            <div class="window-screen">
              <div class="window-tag">PHOTO MODE</div>
              <p class="eyebrow">A NEW RITUAL AFTER SUNSET</p>

              <h1 id="introTitle">
                歡迎進入：<br>
                金曲拍貼機
              </h1>

              <p class="window-copy">
                打開相機，留下一張今晚的回憶吧！
              </p>
            </div>

            <div class="window-bottom">
              <button
                class="primary-button start-button"
                id="startButton"
                type="button"
              >
                Open My Camera
              </button>

              <p class="privacy-note">
                照片只會在你的裝置內完成合成，不會上傳或保存。
              </p>
            </div>
          </div>
        </div>
      </div>

      <div class="intro-bottombar">
        <img
          class="corner-logo-wenyi"
          src="./assets/wenyi-logo.png"
          alt="文義復興 Chiayi"
        >
      </div>
    </section>

    <!-- 拍照頁 -->
    <section
      class="screen camera-screen"
      id="cameraScreen"
      aria-labelledby="cameraTitle"
    >
      <header class="topbar">
        <div class="page-heading">
          <a
            class="home-logo-link"
            href="./"
            aria-label="回到 RASA PHOTO BOOTH 首頁"
            title="回首頁"
          >
            <img src="./assets/rasa-logo.png" alt="RASA">
          </a>

          <div>
            <p class="eyebrow">RASA PHOTO BOOTH</p>
            <h1 id="cameraTitle">Choose a Filter</h1>
          </div>
        </div>

        <button
          class="icon-button"
          id="cameraSwitchButton"
          type="button"
          aria-label="切換前後鏡頭"
        >
          <span aria-hidden="true">↻</span>
          <span class="icon-button-label">鏡頭</span>
        </button>
      </header>

      <div class="camera-card">
        <div class="camera-stage" id="cameraStage">
          <video
            id="cameraVideo"
            autoplay
            muted
            playsinline
            aria-label="相機預覽"
          ></video>

          <img
            id="frameOverlay"
            class="frame-overlay"
            src="./assets/frame-red.png"
            alt=""
            aria-hidden="true"
          >

          <div
            class="camera-status"
            id="cameraStatus"
            role="status"
            aria-live="polite"
          >
            正在開啟相機…
          </div>

          <div class="flash-layer" aria-hidden="true"></div>
        </div>
      </div>

      <div class="frame-picker" role="group" aria-label="選擇照片濾鏡">
        <button
          class="frame-option is-selected"
          type="button"
          data-frame-index="0"
          aria-pressed="true"
        >
          <span class="frame-thumbnail frame-thumbnail-red">
            <img src="./assets/frame-red.png" alt="">
          </span>
          <span>EMBER</span>
        </button>

        <button
          class="frame-option"
          type="button"
          data-frame-index="1"
          aria-pressed="false"
        >
          <span class="frame-thumbnail frame-thumbnail-green">
            <img src="./assets/frame-green.png" alt="">
          </span>
          <span>MOSS</span>
        </button>

        <button
          class="frame-option"
          type="button"
          data-frame-index="2"
          aria-pressed="false"
        >
          <span class="frame-thumbnail frame-thumbnail-orange">
            <img src="./assets/frame-orange.png" alt="">
          </span>
          <span>AMBER</span>
        </button>
      </div>

      <div class="capture-controls">
        <button
          class="shutter-button"
          id="captureButton"
          type="button"
          disabled
          aria-label="拍照"
        >
          <span class="shutter-inner" aria-hidden="true"></span>
        </button>

        <p class="capture-hint">直式拍攝效果最佳</p>
      </div>

      <div class="permission-help" id="permissionHelp" hidden>
        <p id="permissionMessage">無法開啟相機。</p>

        <button
          class="secondary-button"
          id="retryButton"
          type="button"
        >
          重新嘗試
        </button>
      </div>
    </section>

    <!-- 完成頁 -->
    <section
      class="screen result-screen"
      id="resultScreen"
      aria-labelledby="resultTitle"
    >
      <header class="topbar result-topbar">
        <div class="page-heading">
          <a
            class="home-logo-link"
            href="./"
            aria-label="回到 RASA PHOTO BOOTH 首頁"
            title="回首頁"
          >
            <img src="./assets/rasa-logo.png" alt="RASA">
          </a>

          <div>
            <p class="eyebrow">RASA PHOTO BOOTH</p>
            <h1 id="resultTitle">Photo Ready</h1>
          </div>
        </div>
      </header>

      <div class="result-card">
        <img
          id="resultImage"
          alt="拍攝完成的 RASA 套框照片"
        >
      </div>

      <div class="result-actions">
        <button
          class="primary-button"
          id="shareButton"
          type="button"
          hidden
        >
          分享／儲存照片
        </button>

        <a
          class="secondary-button download-button"
          id="downloadButton"
          href="#"
          download
        >
          下載照片
        </a>

        <button
          class="text-button"
          id="retakeButton"
          type="button"
        >
          重新拍攝
        </button>
      </div>

      <p class="ios-note">
        若 iPhone 點擊下載後只開啟圖片，可長按圖片並選擇「儲存到照片」。
      </p>
    </section>
  </main>

  <canvas
    id="captureCanvas"
    width="1633"
    height="2048"
    hidden
  ></canvas>

  <script src="./app.js" defer></script>
</body>
</html>
